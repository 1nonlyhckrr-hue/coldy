name: Publish verified source checkpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-checkpoint.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and expand audited source archive
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('1-luna-consolidated-source.zip')
          expected = '049b5dc20d4aeee363a93d46e88224f76578811481ab353f3c3a6cadbbd38f98'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              assert len(z.infolist()) == 190, 'Archive count mismatch'
              for entry in z.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts, 'Unsafe archive path'
                  assert path.parts[0] not in ('.git', 'node_modules'), 'Forbidden archive path'
                  if entry.is_dir() or entry.filename.startswith('.github/'):
                      continue
                  target = pathlib.Path(entry.filename)
                  data = z.read(entry)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run inventory
      - run: npm run register:preview
      - run: npm audit --omit=dev
      - name: Commit verified expanded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f 1-luna-consolidated-source.zip
          git add -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Add tested community modules and unactivated Music core'
            git push origin HEAD:main
          fi
